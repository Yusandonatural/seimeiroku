<meta charset="utf-8">

  --matcha:#68724d; --matcha-wash:rgba(104,114,77,.14);
  --good:#5a7a4e; --warn:#a56a2a; --bad:#a4432f;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","MS PMincho",serif;
  --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP","Meiryo",sans-serif;
}

  :root{
    --paper:#131722; --card:#1b2130; --card2:#222a3d;

    --line:#39415a; --line-strong:#4d5674;
    --indigo:#9db1dd; --indigo-soft:#7e93c4;
    --gold:#d2ab55; --gold-deep:#e0bd6e; --gold-wash:rgba(210,171,85,.13);
    --vermil:#d76a52; --vermil-wash:rgba(215,106,82,.13);
    --matcha:#9cab7b; --matcha-wash:rgba(156,171,123,.15);
    --good:#8fb37f; --warn:#d1a35e; --bad:#d4715c;
  }
}
:root[data-theme="light"]{
  --paper:#f6f1e6; --card:#fdfaf1; --card2:#f0e9d8;
  --ink:#2b2733; --ink-soft:#5f596b; --ink-faint:#8b8496;
  --line:#d9d0bc; --line-strong:#b9ad92;
  --indigo:#26324e; --indigo-soft:#3d4c6e;
  --gold:#a8842e; --gold-deep:#8a6b20; --gold-wash:rgba(168,132,46,.12);
  --vermil:#b5432e; --vermil-wash:rgba(181,67,46,.1);

}
:root[data-theme="dark"]{

  --ink:#e8e1cd; --ink-soft:#b3abc0; --ink-faint:#847d93;

  --indigo:#9db1dd; --indigo-soft:#7e93c4;
  --gold:#d2ab55; --gold-deep:#e0bd6e; --gold-wash:rgba(210,171,85,.13);
  --vermil:#d76a52; --vermil-wash:rgba(215,106,82,.13);

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.9;
  font-feature-settings:"palt";
}
.wrap{max-width:880px;margin:0 auto;padding:0 20px 96px}

/* ── header ── */
header.site{
  padding:56px 0 36px; text-align:center; position:relative;
  border-bottom:1px solid var(--line);
}
header.site::before{
  content:""; display:block; height:5px; margin:0 auto 44px; max-width:880px;
  border-top:1px solid var(--gold); border-bottom:3px double var(--gold);
  opacity:.75;
}
.site-eyebrow{
  font-family:var(--sans); font-size:11px; letter-spacing:.42em; text-indent:.42em;
  color:var(--gold-deep); text-transform:uppercase; margin-bottom:18px;
}
h1.site-title{
  font-family:var(--serif); font-weight:600;
  font-size:clamp(30px,6vw,42px); letter-spacing:.3em; text-indent:.3em;
  margin:0 0 14px; text-wrap:balance; color:var(--ink);
}
.site-sub{color:var(--ink-soft); font-size:13.5px; letter-spacing:.14em; margin:0}
.seal{
  display:inline-flex; align-items:center; justify-content:center;
  width:34px;height:34px; margin-top:22px;
  border:1.5px solid var(--vermil); color:var(--vermil);
  font-family:var(--serif); font-size:17px; border-radius:4px;
  transform:rotate(-3deg);
}

/* ── form ── */
.entry{
  margin:44px 0 0; background:var(--card); border:1px solid var(--line);
  border-radius:6px; padding:34px 34px 30px; position:relative;
}
.entry::before{
  content:"御記入"; position:absolute; top:-11px; left:28px;
  background:var(--card); padding:0 10px;
  font-family:var(--serif); font-size:12.5px; letter-spacing:.3em;
  color:var(--gold-deep);
}
.f-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:22px 28px}
@media(max-width:620px){.f-grid{grid-template-columns:1fr}}
.f-field{display:flex; flex-direction:column; gap:7px}
.f-label{
  font-size:11.5px; letter-spacing:.22em; color:var(--ink-soft);
  display:flex; align-items:baseline; gap:8px;
}
.f-label .opt{font-size:10px; color:var(--ink-faint); letter-spacing:.08em}
.f-row{display:flex; gap:8px; align-items:center}
input[type=text],input[type=number],select{
  font-family:var(--sans); font-size:15px; color:var(--ink);
  background:var(--paper); border:1px solid var(--line-strong); border-radius:4px;
  padding:9px 12px; width:100%; min-width:0;
}
input:focus-visible,select:focus-visible,button:focus-visible,.chip:focus-visible{
  outline:2px solid var(--gold); outline-offset:2px;
}
.f-unit{font-size:12px; color:var(--ink-faint); flex:none}
.f-check{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); margin-top:4px}
.f-check input{width:15px;height:15px;accent-color:var(--gold)}
.f-actions{margin-top:30px; display:flex; justify-content:center}
button.go{
  font-family:var(--serif); font-size:16.5px; letter-spacing:.42em; text-indent:.42em;
  color:var(--paper); background:var(--indigo);
  border:1px solid var(--indigo); border-radius:4px;
  padding:13px 54px; cursor:pointer; transition:background .2s;
}
:root[data-theme="dark"] button.go, .dark-btn{color:#131722}
@media (prefers-color-scheme: dark){ button.go{color:#131722} }
:root[data-theme="light"] button.go{color:#f6f1e6}
button.go:hover{background:var(--gold-deep); border-color:var(--gold-deep)}
.f-note{margin-top:16px; font-size:11.5px; color:var(--ink-faint); text-align:center; letter-spacing:.05em}
#overseas{display:none; grid-column:1/-1}
#overseas.show{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
@media(max-width:620px){#overseas.show{grid-template-columns:1fr}}

/* ── results shell ── */
#results{display:none}
#results.show{display:block}

/* hero 命式盤 */
.meishiki{
  margin-top:52px; background:var(--card); border:1px solid var(--line-strong);
  border-radius:6px; overflow:hidden; position:relative;
}
.meishiki-head{
  padding:30px 34px 24px; border-bottom:1px solid var(--line);
  background:
    radial-gradient(circle at 84% 20%, var(--gold-wash), transparent 55%),
    var(--card);
  display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap;
}
.m-name{font-family:var(--serif); font-size:30px; letter-spacing:.18em; margin:0; line-height:1.4}
.m-name small{display:block; font-size:12px; color:var(--ink-soft); letter-spacing:.22em; margin-top:6px; font-family:var(--sans)}
.m-chips{display:flex; flex-wrap:wrap; gap:8px; max-width:420px; justify-content:flex-end}
.m-chip{
  font-size:12px; letter-spacing:.06em; padding:5px 12px; border-radius:999px;
  border:1px solid var(--line-strong); background:var(--card2); color:var(--ink-soft);
  white-space:nowrap;
}
.m-chip b{color:var(--ink); font-weight:600; margin-left:4px}
.pillars{
  display:flex; justify-content:center; gap:clamp(14px,4vw,38px);
  padding:30px 20px 34px; background:var(--card);
}
.pillar{display:flex; flex-direction:column; align-items:center; gap:10px}
.pillar .p-label{font-size:10.5px; letter-spacing:.3em; text-indent:.3em; color:var(--ink-faint)}
.pillar .p-kanji{
  writing-mode:vertical-rl; font-family:var(--serif); font-weight:600;
  font-size:clamp(26px,5vw,34px); letter-spacing:.18em; line-height:1;
  padding:14px 10px; border:1px solid var(--line); border-radius:4px;
  background:var(--card2); color:var(--ink); min-height:96px;
}
.pillar.day .p-kanji{border-color:var(--gold); background:var(--gold-wash); color:var(--gold-deep)}
.pillar .p-read{font-size:10.5px; color:var(--ink-faint); letter-spacing:.1em}
.pillar .p-el{font-size:11px; color:var(--ink-soft)}

/* nav chips */
nav.toc{
  position:sticky; top:0; z-index:30;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
  margin:0 -20px; padding:10px 20px;
  display:flex; gap:8px; overflow-x:auto; scrollbar-width:none;
}
nav.toc::-webkit-scrollbar{display:none}
.chip{
  flex:none; font-size:12.5px; letter-spacing:.1em; text-decoration:none;
  color:var(--ink-soft); border:1px solid var(--line-strong); border-radius:999px;
  padding:5px 15px; background:var(--card); white-space:nowrap;
}
.chip:hover{color:var(--gold-deep); border-color:var(--gold)}

/* sections */
section.art{margin-top:64px}
.art-head{display:flex; align-items:center; gap:16px; margin-bottom:6px}
.art-seal{

}

.art-eyebrow{font-size:10.5px; letter-spacing:.3em; color:var(--gold-deep); text-transform:uppercase}

  margin:2px 0 0; text-wrap:balance;
}
.art-rule{border:none; border-top:1px solid var(--line); margin:14px 0 22px; position:relative}
.art-rule::after{content:""; position:absolute; left:0; top:-1px; width:64px; border-top:1px solid var(--gold)}

.card{
  background:var(--card); border:1px solid var(--line); border-radius:6px;
  padding:26px 28px; margin-bottom:16px;
}
.card h3{
  font-family:var(--serif); font-size:16.5px; font-weight:600; letter-spacing:.12em;
  margin:0 0 12px; color:var(--ink);
  display:flex; align-items:center; gap:10px;
}
.card h3::before{content:""; width:7px; height:7px; background:var(--gold); transform:rotate(45deg); flex:none}
.card p{margin:.5em 0; color:var(--ink); max-width:42em}
.muted{color:var(--ink-soft); font-size:13px}
.fine{color:var(--ink-faint); font-size:11.5px; letter-spacing:.04em}

.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 18px; margin:10px 0}
.kv dt{font-size:12px; color:var(--ink-faint); letter-spacing:.14em; padding-top:3px; white-space:nowrap}
.kv dd{margin:0}
.big-sign{font-family:var(--serif); font-size:22px; letter-spacing:.1em}
.big-sign .sym{color:var(--gold-deep); margin-right:8px}

.tag{
  display:inline-block; font-size:11.5px; letter-spacing:.1em; border-radius:3px;
  padding:2px 9px; margin-right:6px; vertical-align:2px;
}
.tag.gold{background:var(--gold-wash); color:var(--gold-deep); border:1px solid var(--gold)}
.tag.verm{background:var(--vermil-wash); color:var(--vermil); border:1px solid var(--vermil)}

}

/* ══════════ 天文計算 ══════════ */
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const norm=d=>((d%360)+360)%360;
const mod=(a,n)=>((a%n)+n)%n;
function jdn(y,m,d){const a=Math.floor((14-m)/12),Y=y+4800-a,M=m+12*a-3;
  return d+Math.floor((153*M+2)/5)+365*Y+Math.floor(Y/4)-Math.floor(Y/100)+Math.floor(Y/400)-32045;}
function jdUT(y,m,d,hLocal,utcOff){return jdn(y,m,d)+((hLocal-utcOff)-12)/24;}
function sunLon(jd){const n=jd-2451545,L=norm(280.460+0.9856474*n),g=rad(norm(357.528+0.9856003*n));
  return norm(L+1.915*Math.sin(g)+0.020*Math.sin(2*g));}
function moonLon(jd){const n=jd-2451545;
  return norm(218.316+13.176396*n+6.289*Math.sin(rad(norm(134.963+13.064993*n))));}
function ascendant(jd,lat,lon){const n=jd-2451545;
  const ramc=rad(norm(norm(280.46061837+360.98564736629*n)+lon));
  const eps=rad(23.4393),phi=rad(lat);
  return norm(deg(Math.atan2(Math.cos(ramc),-(Math.sin(ramc)*Math.cos(eps)+Math.tan(phi)*Math.sin(eps)))));}
const signOf=lon=>Math.floor(norm(lon)/30);
const degInSign=lon=>norm(lon)%30;

/* ══════════ 四柱推命 ══════════ */
function fourPillars(y,m,d,hour,utcOff){
  const sl=sunLon(jdUT(y,m,d,12,utcOff)); // 現地正午の太陽黄経
  let py=y; if(m<=2 && sl>=270 && sl<315) py=y-1;           // 立春前は前年
  const ys=mod(py-4,10), yb=mod(py-4,12);
  const mi=Math.floor(norm(sl-315)/30);                      // 0=寅月
  const ms=mod((ys%5)*2+2+mi,10), mb=mod(2+mi,12);
  const di=mod(jdn(y,m,d)+49,60), ds=di%10, db=di%12;
  let hs=null,hb=null;
  if(hour!=null){ hb=Math.floor(mod(hour+1,24)/2)%12; hs=mod((ds%5)*2+hb,10); }
  return {py,ys,yb,ms,mb,di,ds,db,hs,hb,sl};
}
function kanshiName(s,b){return STEMS[s]+BRANCHES[b];}
function voidBranches(di){const g=Math.floor(di/10);return [mod(10-2*g,12),mod(11-2*g,12)];}
function tsuhen(dayS,otherS){
  const rel=mod(stemElem(otherS)-stemElem(dayS),5);
  const same=(dayS%2)===(otherS%2);
  return rel*2+(same?0:1);
}
/* 五行相性 rel: 0比和 1生入(相手が生) 2泄(自分が生) 3剋入 4剋出 */
function elemRel(mine,other){
  if(mine===other)return 0;
  if(mod(other+1,5)===mine)return 1;
  if(mod(mine+1,5)===other)return 2;
  if(mod(other+2,5)===mine)return 3;
  return 4;
}

/* ══════════ 九星 ══════════ */
function honmeiStar(py){let n=11-mod(py,9); if(n>9)n-=9; return n;}
function yearOfNow(date,utcOff){
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  const sl=sunLon(jdUT(y,m,d,12,utcOff==null?9:utcOff));
  let py=y; if(m<=2 && sl>=270 && sl<315) py=y-1;
  return py;
}
function starAt(center,base){let s=center+(base-5); while(s<1)s+=9; while(s>9)s-=9; return s;}

/* ══════════ 姓名判断 ══════════ */
function kakusuNorm(n){while(n>81)n-=80;return n;}
function nameGrids(seiArr,meiArr){
  const sSum=seiArr.reduce((a,b)=>a+b,0), mSum=meiArr.reduce((a,b)=>a+b,0);
  const ten=sSum+(seiArr.length===1?1:0);
  const chi=mSum+(meiArr.length===1?1:0);
  const jin=seiArr[seiArr.length-1]+meiArr[0];
  const sou=sSum+mSum;
  const gai=Math.max(ten+chi-jin,1);
  return {天格:kakusuNorm(ten),人格:kakusuNorm(jin),地格:kakusuNorm(chi),外格:kakusuNorm(gai),総格:kakusuNorm(sou)};
}

function render(inp){
  const {sei,mei,y,m,d,hour,lat,lon,utc}=inp;
  const now=new Date();
  const calcHour=hour==null?12:hour;
  const jdBirth=jdUT(y,m,d,calcHour,utc);

  /* 西洋 */
  const sunL=sunLon(jdBirth), moonL=moonLon(jdBirth);
  const sun=signOf(sunL), moon=signOf(moonL);
  const asc=hour==null?null:signOf(ascendant(jdBirth,lat,lon));

  /* 四柱 */
  const fp=fourPillars(y,m,d,hour,utc);

  /* 九星 */
  const myStar=honmeiStar(fp.py);

  /* 動物 */
  const charNo=fp.di+1, charName=CHARS60[fp.di][0], animal=CHARS60[fp.di][1];

  /* 今年・今日 */
  const nowY=yearOfNow(now,9);
  const nys=mod(nowY-4,10), nyb=mod(nowY-4,12);
  const jdToday=jdn(now.getFullYear(),now.getMonth()+1,now.getDate());
  const tdi=mod(jdToday+49,60), tds=tdi%10, tdb=tdi%12;

  CUR={inp,fp,sun,moon,asc,sunL,moonL,myStar,charNo,charName,animal,now,nowY,nys,nyb,tdi,tds,tdb};

  renderHero(); renderWest(); renderShichu(); renderName(); renderKyusei(); renderAnimal();
  renderSynth(); renderJobs(); renderLife(); renderHealth(); renderYear(); renderToday(); renderKids();
}

function renderName(){
  const {inp}=CUR;
  const seiChars=[...inp.sei], meiChars=[...inp.mei];
  const all=[...seiChars.map((c,i)=>({c,grp:"sei",i})),...meiChars.map((c,i)=>({c,grp:"mei",i}))];
  const inputs=all.map((o,idx)=>{

    return `${o.grp==="mei"&&o.i===0?'<div class="st-sep" aria-hidden="true">／</div>':""}
      <div class="st-char">
        <div class="ch">${esc(o.c)}</div>
        <input type="number" min="1" max="40" id="st-${idx}" value="${st||""}" placeholder="?" aria-label="${esc(o.c)}の画数">
      </div>`;
  }).join("");
  $("name-body").innerHTML=`
    <div class="card">
      <h3>各文字の画数</h3>

      <div class="strokes-edit" id="strokes-edit">${inputs}</div>
      <div id="goka-out"></div>
    </div>
    <div class="card" id="name-reading"></div>
    <div class="card">
      <h3>姓名から見た運勢について</h3>
      <p>姓名判断が示すのは年ごとの吉凶ではなく、生涯を通じて流れ続ける通奏低音です。中でも<strong>人格</strong>は働き盛りの中年期に、<strong>総格</strong>は晩年に向けて強く現れるとされます。今年の具体的な運気は、四柱推命・九星の章をあわせてご覧ください。</p>
    </div>`;
  const recompute=()=>{
    const vals=all.map((_,idx)=>+$("st-"+idx).value||0);
    if(vals.some(v=>v<=0)){
      $("goka-out").innerHTML='<p class="fine">未入力の画数があります。すべて入力すると五格が表示されます。</p>';
      $("name-reading").innerHTML='<h3>五格の読み解き</h3><p class="muted">画数の入力をお待ちしています。</p>';
      return;
    }
    const seiArr=vals.slice(0,seiChars.length), meiArr=vals.slice(seiChars.length);
    const g=nameGrids(seiArr,meiArr);
    $("goka-out").innerHTML=`<div class="goka">${Object.entries(g).map(([k,v])=>{
      const [f,ph]=KAKUSU[v];
      return `<div class="gk"><div class="gk-name">${k}</div><div class="gk-num">${v}</div>
        <div class="gk-fortune ${fClass(f)}">${f}</div><div class="gk-phrase">${ph}</div></div>`;
    }).join("")}</div>`;
    const jin=KAKUSU[g["人格"]], sou=KAKUSU[g["総格"]], chi=KAKUSU[g["地格"]], gai=KAKUSU[g["外格"]], ten=KAKUSU[g["天格"]];
    // 三才配置（天・人・地の五行の流れ）
    const digitElem=n=>{const d=n%10;return d===1||d===2?0:d===3||d===4?1:d===5||d===6?2:d===7||d===8?3:4;};
    const tE=digitElem(g["天格"]),jE=digitElem(g["人格"]),cE=digitElem(g["地格"]);
    const r1=elemRel(jE,tE),r2=elemRel(jE,cE);
    const ok=r=>r===0||r===1||r===2;
    const sansaiJudge=ok(r1)&&ok(r2)
      ?["良好","五行が淀みなく流れる良い配置です。土台となる運の巡りが自然で、努力が結果につながりやすい名前といえます。"]
      :ok(r1)||ok(r2)
      ?["まずまず","一部に五行のぶつかりがありますが、流れの良い側が支えてくれます。無理が続いたら早めの休息を。"]
      :["要調整","五行がぶつかり合う配置です。環境の影響を受けやすいので、住まいと人間関係の「心地よさ」を優先すると運が整います。"];
    $("name-reading").innerHTML=`
      <h3>五格の読み解き</h3>
      <p><strong>天格 ${g["天格"]}画（${ten[0]}・${ten[1]}）</strong>　${GOKAKU_DESC["天格"]}${FORTUNE_LONG[ten[0]]}</p>
      <p><strong>人格 ${g["人格"]}画（${jin[0]}・${jin[1]}）</strong>　${GOKAKU_DESC["人格"]}あなたの中心には「${jin[1]}」の気質が流れています。${FORTUNE_LONG[jin[0]]}</p>
      <p><strong>地格 ${g["地格"]}画（${chi[0]}・${chi[1]}）</strong>　${GOKAKU_DESC["地格"]}若い頃の土台は「${chi[1]}」。${FORTUNE_LONG[chi[0]]}</p>
      <p><strong>外格 ${g["外格"]}画（${gai[0]}・${gai[1]}）</strong>　${GOKAKU_DESC["外格"]}周囲からは「${gai[1]}」の人と映りやすいでしょう。${FORTUNE_LONG[gai[0]]}</p>
      <p><strong>総格 ${g["総格"]}画（${sou[0]}・${sou[1]}）</strong>　${GOKAKU_DESC["総格"]}生涯を貫くテーマは「${sou[1]}」です。${FORTUNE_LONG[sou[0]]}</p>
      <h3 style="margin-top:22px">三才配置 ─ ${ELEMS[tE]}・${ELEMS[jE]}・${ELEMS[cE]}（${sansaiJudge[0]}）</h3>
      <p>天格・人格・地格それぞれの画数の一の位から五行を取り、気の流れを見る配置法です。あなたの名前は天＝<strong>${ELEMS[tE]}</strong>、人＝<strong>${ELEMS[jE]}</strong>、地＝<strong>${ELEMS[cE]}</strong>。${sansaiJudge[1]}</p>
      <p class="fine">三才配置は流派による解釈差が特に大きい項目です。ひとつの参考としてご覧ください。</p>`;
    // ヒーローの総格チップも更新
    renderHeroChipSou(g["総格"]);
  };
  all.forEach((_,idx)=>$("st-"+idx).addEventListener("input",recompute));
  recompute();
}

/* ── 九星気学・方位 ── */
function renderKyusei(){
  const {myStar,nowY,nys,nyb}=CUR;
  const K=KYUSEI[myStar-1];
  const center=honmeiStar(nowY); // 年盤中宮
  // 各方位の星
  const board={}; PALACES.forEach(p=>{board[p.dir]=starAt(center,p.base);});
  const gooDir=[],badDir={};
  const gohoDir=Object.keys(board).find(d=>board[d]===5);
  if(gohoDir){badDir[gohoDir]=(badDir[gohoDir]?badDir[gohoDir]+"・":"")+"五黄殺";badDir[OPP_DIR[gohoDir]]=(badDir[OPP_DIR[gohoDir]]?badDir[OPP_DIR[gohoDir]]+"・":"")+"暗剣殺";}
  const saihaDir=OPP_DIR[BRANCH_DIR[nyb]];
  badDir[saihaDir]=(badDir[saihaDir]?badDir[saihaDir]+"・":"")+"歳破";
  const myDir=Object.keys(board).find(d=>board[d]===myStar);
  if(myDir){badDir[myDir]=(badDir[myDir]?badDir[myDir]+"・":"")+"本命殺";badDir[OPP_DIR[myDir]]=(badDir[OPP_DIR[myDir]]?badDir[OPP_DIR[myDir]]+"・":"")+"本命的殺";}
  Object.keys(board).forEach(d=>{
    if(badDir[d])return;
    const s=board[d]; if(s===5||s===myStar)return;
    const r=elemRel(K.el,KYUSEI[s-1].el);
    if(r===0||r===1||r===2) gooDir.push(d);
  });
  // 盤の描画（北を上）: grid order rows: [南東?]... 北上表示 → 上段: 北西 北 北東 / 中段: 西 中 東 / 下段: 南西 南 南東? 地図的に上=北なら 左上=北西
  const gridOrder=[["北西","北","北東"],["西","中","東"],["南西","南","南東"]];
  const cells=gridOrder.flat().map(dir=>{
    if(dir==="中")return `<div class="cell center"><div class="dir">中宮</div><div class="star">${KYUSEI[center-1].n.slice(0,2)}</div></div>`;
    const s=board[dir], good=gooDir.includes(dir), bad=badDir[dir];
    return `<div class="cell${good?" good":bad?" bad":""}">
      <div class="dir">${dir}</div><div class="star">${KYUSEI[s-1].n.slice(0,2)}</div>
      ${good?'<div class="mark">吉方</div>':bad?`<div class="mark">${bad}</div>`:""}
    </div>`;
  }).join("");
  const myPalace=myDir?PALACES.find(p=>p.dir===myDir).base:5;
  // 月命星
  const mi=mod(CUR.fp.mb-2,12);
  const gm=mod(GETSUMEI_START[myStar]-1-mi,9)+1;
  // 相性の良い九星（生じてくれる星＝生気、同じ五行＝比和）
  const seiki=KYUSEI.filter((s,i)=>i+1!==myStar&&elemRel(K.el,s.el)===1).map(s=>s.n);
  const hiwa=KYUSEI.filter((s,i)=>i+1!==myStar&&elemRel(K.el,s.el)===0).map(s=>s.n);
  $("kyusei-body").innerHTML=`
    <div class="card">
      <h3>本命星 ─ ${K.n}</h3>
      <p>${K.t}</p>
      <p class="muted">定位は<strong>${K.home}</strong>、五行は${elTag(K.el)}の星です。</p>
    </div>
    <div class="card">
      <h3>月命星 ─ ${KYUSEI[gm-1].n}</h3>
      <p>本命星が「社会での自分・大人になってからの自分」を表すのに対し、生まれ月から出す月命星は<strong>感情面・若い頃の気質</strong>を表すとされます。あなたの月命星は<strong>${KYUSEI[gm-1].n}</strong>。${gm===myStar?"本命星と同じ星が重なる生まれで、内と外の顔が一致した、裏表のない気質です。":`内面には${KYUSEI[gm-1].t.split("。")[0]}。${KYUSEI[gm-1].t.split("。")[1]||""}という顔が隠れています。`}</p>
      <p class="muted">気の合う九星は${seiki.length?`、あなたの${ELEMS[K.el]}の気を育ててくれる<strong>${seiki.join("・")}</strong>`:""}${hiwa.length?`、同じ${ELEMS[K.el]}の気で支え合う<strong>${hiwa.join("・")}</strong>`:""}の人とされます。</p>
    </div>
    <div class="card">
      <h3>${nowY}年の方位盤と吉方位</h3>
      <div class="ban-wrap">
        <div class="ban" role="img" aria-label="${nowY}年の年盤">${cells}</div>
        <div class="ban-legend">
          <ul>
            <li><span class="dir-b" style="color:var(--good)">吉方位</span><span>${gooDir.length?gooDir.join("・"):"今年は本命星と相性のよい安全な方位が限られます"}</span></li>
            <li><span class="dir-b" style="color:var(--bad)">凶方位</span><span>${Object.entries(badDir).map(([d,n])=>`${d}（${n}）`).join("、")}</span></li>
            <li><span class="dir-b">今年の恵方</span><span>${EHO[CUR.nys]}</span></li>
          </ul>
          <p class="fine">吉方位への旅行・引越し・参拝は運気を養うとされます。凶方位は「行ってはいけない」ではなく、大きな決断や移転を避け慎重に、という目安です。</p>
        </div>
      </div>
    </div>
    <div class="card">
      <h3>九星から見た今年</h3>
      <p>${nowY}年、あなたの${K.n}は<strong>${PALACE_T[myPalace].split("＝")[0]}</strong>に回座します。${PALACE_T[myPalace].split("＝")[1]}</p>
    </div>`;
}

function palaceOfYear(y,myStar){            // その年に本命星が回座する宮（定位番号1-9）
  const center=honmeiStar(y);
  let base=myStar-center+5;
  while(base<1)base+=9; while(base>9)base-=9;
  return base;
}
function renderLife(){
  const {fp,myStar,nowY}=CUR;
  const vb=voidBranches(fp.di);
  const maxAge=90;
  const pts=[];
  for(let a=0;a<=maxAge;a++){
    const y=fp.py+a;
    pts.push({a,y,base:palaceOfYear(y,myStar),voidY:vb.includes(mod(y-4,12))});
  }
  // SVG カーブ
  const W=1000,H=220,padL=40,padR=14,padT=16,padB=34;
  const X=a=>padL+(W-padL-padR)*a/maxAge;
  const Y=s=>padT+(H-padT-padB)*(1-(s-1)/4);
  const P=pts.map(p=>({x:X(p.a),y:Y(PALACE_SCORE[p.base])}));
  let line=`M${P[0].x.toFixed(1)},${P[0].y.toFixed(1)}`;
  for(let i=0;i<P.length-1;i++){                       // Catmull-Rom → ベジェで滑らかに
    const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
    line+=`C${(p1.x+(p2.x-p0.x)/6).toFixed(1)},${(p1.y+(p2.y-p0.y)/6).toFixed(1)} ${(p2.x-(p3.x-p1.x)/6).toFixed(1)},${(p2.y-(p3.y-p1.y)/6).toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  const area=`${line} L${X(maxAge)},${Y(0.8)} L${X(0)},${Y(0.8)} Z`;
  const grid=[];
  for(let a=0;a<=maxAge;a+=10)grid.push(`<line x1="${X(a)}" y1="${padT}" x2="${X(a)}" y2="${H-padB}" stroke="var(--line)" stroke-width="1"/><text x="${X(a)}" y="${H-padB+18}" text-anchor="middle" font-size="11" fill="var(--ink-faint)">${a}歳</text>`);
  const voidDots=pts.filter(p=>p.voidY).map(p=>`<circle cx="${X(p.a)}" cy="${Y(PALACE_SCORE[p.base])}" r="3" fill="var(--vermil)"/>`).join("");
  const nowAge=nowY-fp.py;
  const nowMark=(nowAge>=0&&nowAge<=maxAge)?`<line x1="${X(nowAge)}" y1="${padT}" x2="${X(nowAge)}" y2="${H-padB}" stroke="var(--gold)" stroke-width="2" stroke-dasharray="4 3"/><text x="${X(nowAge)}" y="${padT-2}" text-anchor="middle" font-size="11" fill="var(--gold-deep)" font-weight="bold">いま ${nowAge}歳</text>`:"";
  const svg=`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="年齢ごとの運気カーブ" style="min-width:720px;max-width:none">
    ${grid.join("")}
    <path d="${area}" fill="var(--gold-wash)"/>
    <path d="${line}" fill="none" stroke="var(--gold-deep)" stroke-width="2.2" stroke-linejoin="round"/>
    ${voidDots}${nowMark}
    <text x="${padL-6}" y="${Y(5)+4}" text-anchor="end" font-size="10" fill="var(--ink-faint)">好調</text>
    <text x="${padL-6}" y="${Y(1)+4}" text-anchor="end" font-size="10" fill="var(--ink-faint)">充電</text>
  </svg></div>`;
  // 今後10年
  const next10=pts.filter(p=>p.y>=nowY&&p.y<nowY+10).map(p=>`
    <div class="mini${p.y===nowY?" now":""}"><div class="mini-label">${p.y}年（${p.a}歳）${p.y===nowY?"・今年":""}</div>
      <div class="mini-val">${PALACE_SHORT[p.base]}${p.voidY?'<span class="tag verm" style="margin-left:8px">空亡</span>':""}</div>
      <div class="mini-note">${PALACE_T[p.base].split("＝")[1].split("。")[0]}。</div></div>`).join("");
  // 次の見どころ
  const nextPeak=pts.find(p=>p.y>nowY&&p.base===7);
  const nextRest=pts.find(p=>p.y>=nowY&&p.base===1);
  $("life-body").innerHTML=`
    <div class="card">
      <h3>0歳から90歳までの運気カーブ</h3>
      <p class="muted">九星気学の9年周期（本命星${KYUSEI[myStar-1].n}が毎年めぐる宮）で描いた、あなたの運気の波です。<span style="color:var(--vermil)">●</span>は四柱推命の空亡（天中殺）にあたる年——新しい種まきより整理と充電に向く年です。年齢は立春区切りの目安です。</p>
      ${svg}
      <p class="muted">運気は9年でひとまわり。${nextPeak?`次の大きな見どころは<strong>${nextPeak.y}年（${nextPeak.a}歳・${PALACE_SHORT[nextPeak.base]}）</strong>。`:""}${nextRest?`<strong>${nextRest.y}年（${nextRest.a}歳）</strong>は充電の年なので、その前に仕込みを済ませておくのが上手な波乗りです。`:""}低い谷は「悪い年」ではなく、次の山のための準備期間と読んでください。</p>
    </div>
    <div class="card">
      <h3>これからの10年</h3>
      <div class="months">${next10}</div>
    </div>`;
}

/* ── 今日の運勢 ── */
function dayScore(di){
  const fp=CUR.fp, s=di%10, b=di%12;
  const vb=voidBranches(fp.di);
  let score=3,notes=[];
  if(mod(s-fp.ds+10,10)===5){score++;notes.push("日干が「干合」を結ぶ、縁がまとまりやすい日");}
  if(mod(b+fp.db,12)===1){score++;notes.push("地支が「支合」する、調和の流れの日");}
  if(b%4===fp.db%4&&b!==fp.db){score++;notes.push("地支が「三合」を組む、追い風の日");}
  if(mod(fp.db+6,12)===b){score--;notes.push("地支が「冲」でぶつかる日。予定変更は柔軟に");}
  if(di===fp.di){score=5;notes.push("60日に一度、自分の日柱と同じ干支がめぐる「律の日」。直感が冴えます");}
  if(vb.includes(b)){score=Math.min(score,2);notes.push("天中殺（空亡）の日。新しい種まきより、整理と充電を");}
  return {score:Math.max(1,Math.min(5,score)),notes};
}

/* ══════════ 天文・命式計算（個人版と同一ロジック） ══════════ */
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const norm=d=>((d%360)+360)%360;
const mod=(a,n)=>((a%n)+n)%n;
function jdn(y,m,d){const a=Math.floor((14-m)/12),Y=y+4800-a,M=m+12*a-3;
  return d+Math.floor((153*M+2)/5)+365*Y+Math.floor(Y/4)-Math.floor(Y/100)+Math.floor(Y/400)-32045;}
function jdUT(y,m,d,hLocal,utcOff){return jdn(y,m,d)+((hLocal-utcOff)-12)/24;}
function sunLon(jd){const n=jd-2451545,L=norm(280.460+0.9856474*n),g=rad(norm(357.528+0.9856003*n));
  return norm(L+1.915*Math.sin(g)+0.020*Math.sin(2*g));}
function moonLon(jd){const n=jd-2451545;
  return norm(218.316+13.176396*n+6.289*Math.sin(rad(norm(134.963+13.064993*n))));}
function ascendant(jd,lat,lon){const n=jd-2451545;
  const ramc=rad(norm(norm(280.46061837+360.98564736629*n)+lon));
  const eps=rad(23.4393),phi=rad(lat);
  return norm(deg(Math.atan2(Math.cos(ramc),-(Math.sin(ramc)*Math.cos(eps)+Math.tan(phi)*Math.sin(eps)))));}
const signOf=lon=>Math.floor(norm(lon)/30);
function fourPillars(y,m,d,hour,utcOff){
  const sl=sunLon(jdUT(y,m,d,12,utcOff));
  let py=y; if(m<=2 && sl>=270 && sl<315) py=y-1;
  const ys=mod(py-4,10), yb=mod(py-4,12);
  const mi=Math.floor(norm(sl-315)/30);
  const ms=mod((ys%5)*2+2+mi,10), mb=mod(2+mi,12);
  const di=mod(jdn(y,m,d)+49,60), ds=di%10, db=di%12;
  let hs=null,hb=null;
  if(hour!=null){ hb=Math.floor(mod(hour+1,24)/2)%12; hs=mod((ds%5)*2+hb,10); }
  return {py,ys,yb,ms,mb,di,ds,db,hs,hb,sl,mi};
}
function kanshiName(s,b){return STEMS[s]+BRANCHES[b];}
function voidBranches(di){const g=Math.floor(di/10);return [mod(10-2*g,12),mod(11-2*g,12)];}
function tsuhen(dayS,otherS){
  const rel=mod(stemElem(otherS)-stemElem(dayS),5);
  return rel*2+((dayS%2)===(otherS%2)?0:1);
}
function elemRel(mine,other){
  if(mine===other)return 0;
  if(mod(other+1,5)===mine)return 1;
  if(mod(mine+1,5)===other)return 2;
  if(mod(other+2,5)===mine)return 3;
  return 4;
}
function honmeiStar(py){let n=11-mod(py,9); if(n>9)n-=9; return n;}
function yearOfNow(date,utcOff){
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  const sl=sunLon(jdUT(y,m,d,12,utcOff==null?9:utcOff));
  return (m<=2 && sl>=270 && sl<315)?y-1:y;
}
function starAt(center,base){let s=center+(base-5); while(s<1)s+=9; while(s>9)s-=9; return s;}
function kakusuNorm(n){while(n>81)n-=80;return n;}
function nameGrids(seiArr,meiArr){
  const sSum=seiArr.reduce((a,b)=>a+b,0), mSum=meiArr.reduce((a,b)=>a+b,0);
  const ten=sSum+(seiArr.length===1?1:0), chi=mSum+(meiArr.length===1?1:0);
  const jin=seiArr[seiArr.length-1]+meiArr[0], sou=sSum+mSum;
  const gai=Math.max(ten+chi-jin,1);
  return {天格:kakusuNorm(ten),人格:kakusuNorm(jin),地格:kakusuNorm(chi),外格:kakusuNorm(gai),総格:kakusuNorm(sou)};
}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fClass=f=>({"大吉":"f-daikichi","吉":"f-kichi","半吉":"f-hankichi","凶":"f-kyo"})[f]||"f-kyo";
function starsHtml(n){let h="";for(let i=1;i<=5;i++)h+=i<=n?"★":'<span class="off">★</span>';return `<span class="stars" style="font-size:14px" role="img" aria-label="5点満点中${n}点">${h}</span>`;}
function dayScoreFor(fp,di){
  const s=di%10, b=di%12, vb=voidBranches(fp.di);
  let score=3,notes=[];
  if(mod(s-fp.ds+10,10)===5){score++;notes.push("干合の日");}
  if(mod(b+fp.db,12)===1){score++;notes.push("支合の日");}
  if(b%4===fp.db%4&&b!==fp.db){score++;notes.push("三合の追い風");}
  if(mod(fp.db+6,12)===b){score--;notes.push("冲・予定は柔軟に");}
  if(di===fp.di){score=5;notes.push("60日に一度の律の日");}
  if(vb.includes(b)){score=Math.min(score,2);notes.push("空亡・充電日");}
  return {score:Math.max(1,Math.min(5,score)),notes};
}

const LSF_KEY=TEAM?"seimeiroku_team_v1":"seimeiroku_fam_v1";

let PROFILES=[], NOWCTX=null;
document.getElementById("form").addEventListener("submit",e=>{
  e.preventDefault();
  const rows=[...document.querySelectorAll(".member-row")];
  const people=[];
  for(const r of rows){
    const sei=r.querySelector(".isei").value.trim(), mei=r.querySelector(".imei").value.trim();
    const y=+r.querySelector(".iy").value, m=+r.querySelector(".im").value, d=+r.querySelector(".id").value;
    if(!sei||!mei||!y||!m||!d) continue;
    const dt=new Date(y,m-1,d);
    if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d){alert(`${mei}さんの日付が実在しません。`);return;}
    let hour=null;
    const hv=r.querySelector(".ih").value;
    if(hv!=="")hour=+hv+(+r.querySelector(".imin").value||0)/60;
    const pv=r.querySelector(".ipref").value;
    const place=pv==="none"?null:PREFS[+pv];
    people.push({sei,mei,y,m,d,hour,place});
  }
  if(!people.length){alert("少なくとも一人分の姓・名・生年月日を入力してください。");return;}
  saveMembers();
  PROFILES=people.map(buildProfile);
  const now=new Date();
  const nowY=yearOfNow(now,9);
  NOWCTX={now,nowY,nys:mod(nowY-4,10),nyb:mod(nowY-4,12),
    jdToday:jdn(now.getFullYear(),now.getMonth()+1,now.getDate())};
  NOWCTX.tdi=mod(NOWCTX.jdToday+49,60);
  NOWCTX.teamName=TEAM?(($("teamname")&&$("teamname").value.trim())||PROFILES[0].sei+"チーム"):"";
  renderAll();
  $("results").classList.add("show");
  requestAnimationFrame(()=>$("hero").scrollIntoView({behavior:"smooth",block:"start"}));
});

function buildProfile(p){
  const calcHour=p.hour==null?12:p.hour;
  const jdB=jdUT(p.y,p.m,p.d,calcHour,9);
  const fp=fourPillars(p.y,p.m,p.d,p.hour,9);
  const sun=signOf(sunLon(jdB)), moon=signOf(moonLon(jdB));
  const asc=(p.hour!=null&&p.place)?signOf(ascendant(jdB,p.place[1],p.place[2])):null;
  const myStar=honmeiStar(fp.py);
  const gm=mod(GETSUMEI_START[myStar]-1-fp.mi,9)+1;
  const charNo=fp.di+1, charName=CHARS60[fp.di][0], animal=CHARS60[fp.di][1];
  // 画数（辞書のみ・全文字判明した場合のみ五格算出）
  const seiSt=[...p.sei].map(lookupStroke), meiSt=[...p.mei].map(lookupStroke);
  const grids=(seiSt.every(Boolean)&&meiSt.every(Boolean))?nameGrids(seiSt,meiSt):null;
  // 五行カウント
  const counts=[0,0,0,0,0];
  const parts=[[fp.ys,fp.yb],[fp.ms,fp.mb],[fp.ds,fp.db]];
  if(fp.hs!=null)parts.push([fp.hs,fp.hb]);
  parts.forEach(([s,b])=>{counts[stemElem(s)]++;counts[BRANCH_ELEM[b]]++;});
  return {...p,fp,sun,moon,asc,myStar,gm,charNo,charName,animal,grids,counts};
}

/* 相性くらべ（星座エレメント・日柱干支・九星の三占術） */
function pairDetail(a,b){
  // 星座エレメント
  const ea=SIGNS[a.sun].el, eb=SIGNS[b.sun].el;
  const good=(x,y)=>(x==="火"&&y==="風")||(x==="風"&&y==="火")||(x==="地"&&y==="水")||(x==="水"&&y==="地");
  const sStar=ea===eb?1:good(ea,eb)?2:0;
  const starWord=ea===eb?`${ea}×${eb}・波長が共鳴`:good(ea,eb)?`${ea}×${eb}・引き立て合う好相性`:`${ea}×${eb}・違いが学びの異文化`;
  // 日柱干支（動物占いのベース）
  const gou=mod(a.fp.ds-b.fp.ds+10,10)===5;
  const shigou=mod(a.fp.db+b.fp.db,12)===1;
  const sangou=a.fp.db%4===b.fp.db%4&&a.fp.db!==b.fp.db;
  const chu=mod(a.fp.db+6,12)===b.fp.db;
  const sDay=(gou||shigou||sangou)?2:chu?0:1;
  const dayWord=gou&&shigou?"干合＋支合の「天地徳合」・特別な深い縁":gou?"干合・引かれ合う縁":shigou?"支合・結ばれる縁":sangou?"三合・同じ流れに乗る縁":chu?"冲・ぶつかるほど遠慮のない縁":"穏やかな縁";
  // 九星
  const r=elemRel(KYUSEI[a.myStar-1].el,KYUSEI[b.myStar-1].el);
  const sK=(r===1||r===2)?2:r===0?1:0;
  const kWord=(r===1||r===2)?"気を生じ合う相生":r===0?"同じ気で支え合う比和":"鍛え合う相剋";
  const total=sStar+sDay+sK;
  return {sStar,sDay,sK,total,starWord,dayWord,kWord,sym:total>=5?"◎":total>=3?"○":"△"};
}

/* 今年の運勢 */
function renderYearF(){
  const {nowY,nys,nyb}=NOWCTX;
  const center=honmeiStar(nowY);
  const board={};PALACES.forEach(p=>{board[p.dir]=starAt(center,p.base);});
  $("year-title").textContent=`今年の運勢 ─ ${nowY}年（${kanshiName(nys,nyb)}）`;
  const scores=PROFILES.map(p=>{
    const ts=tsuhen(p.fp.ds,nys);
    const myDir=Object.keys(board).find(d=>board[d]===p.myStar);
    const palace=myDir?PALACES.find(x=>x.dir===myDir).base:5;
    let score=3;
    if([2,4,5,7,9].includes(ts))score++;
    if([3,4,6,7,9].includes(palace))score++;
    if(mod(p.fp.db+6,12)===nyb)score--;
    if(p.fp.db%4===nyb%4)score++;
    return {ts,palace,score:Math.max(1,Math.min(5,score))};
  });
  const best=Math.max(...scores.map(s=>s.score));
  const rows=[
    row("総合",scores.map(s=>starsHtml(s.score)),scores.map((s,i)=>s.score===best?i:-1).filter(i=>i>=0)),
    row("通変星",scores.map(s=>`<strong>${TSUHEN[s.ts]}</strong><span class="sub">${TSUHEN_M[s.ts]}</span>`)),
    row("九星の宮",scores.map(s=>`${PALACE_T[s.palace].split("＝")[0]}<span class="sub">${PALACE_T[s.palace].split("＝")[1].split("。")[0]}</span>`)),
    row("星の風向き",PROFILES.map(p=>YEAR_EL_T[elemRel(SIGN_EL_TO_GOGYO[SIGNS[p.sun].el],stemElem(nys))].split("。")[0]))
  ];
  const bestNames=PROFILES.filter((p,i)=>scores[i].score===best).map(p=>p.mei);
  $("year-body").innerHTML=`
    <div class="card"><h3>今年の運勢比較</h3>${cmpTable("年",rows)}
      <p class="muted" style="margin-top:12px">今年いちばん風が吹いているのは<strong>${bestNames.map(esc).join("・")}</strong>さん。${TEAM?"新規プロジェクトの推進役は、勢いのある人に任せるとうまく回ります。":"家族の新しい挑戦は、勢いのある人を先頭に立てるとうまく回ります。"}恵方は<strong>${EHO[nys]}</strong>（${GRPWORD}共通）です。</p>
    </div>`;
}

/* 今日の運勢 */
function renderTodayF(){
  const {now,jdToday,tdi}=NOWCTX;
  const tds=tdi%10;
  const dayEl=stemElem(tds);
  const luckyColor={0:"緑・若草色",1:"赤・朱色",2:"黄・山吹色",3:"白・金色",4:"藍・黒"}[dayEl];
  $("today-title").textContent=`今日の運勢 ─ ${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${kanshiName(tds,tdi%12)}の日）`;
  const youbi=["日","月","火","水","木","金","土"];
  const todays=PROFILES.map(p=>dayScoreFor(p.fp,tdi));
  const bests=PROFILES.map(p=>{
    let best=null;
    for(let i=1;i<=7;i++){
      const di=mod(jdToday+i+49,60), r=dayScoreFor(p.fp,di);
      if(!best||r.score>best.score){const d=new Date(now);d.setDate(d.getDate()+i);best={score:r.score,date:d};}
    }
    return best;
  });
  const top=Math.max(...todays.map(t=>t.score));
  const rows=[
    row("今日",todays.map(t=>starsHtml(t.score)),todays.map((t,i)=>t.score===top?i:-1).filter(i=>i>=0)),
    row("今日のメモ",todays.map(t=>t.notes.length?t.notes.join("、"):"平常運転の一日")),
    row("今週のベスト日",bests.map(b=>`<strong>${b.date.getMonth()+1}/${b.date.getDate()}（${youbi[b.date.getDay()]}）</strong> ${starsHtml(b.score)}`))
  ];
  const topNames=PROFILES.filter((p,i)=>todays[i].score===top).map(p=>p.mei);
  $("today-body").innerHTML=`
    <div class="card"><h3>今日の運勢比較</h3>${cmpTable("日",rows)}
      <div class="today-grid" style="margin-top:14px">
        <div class="mini"><div class="mini-label">今日のラッキーカラー（家族共通）</div><div class="mini-val">${luckyColor}</div>
          <div class="mini-note">日干${STEMS[tds]}（${ELEMS[dayEl]}）の気にちなむ色。</div></div>
        <div class="mini"><div class="mini-label">今日の主役</div><div class="mini-val">${topNames.map(esc).join("・")}さん</div>
          <div class="mini-note">${TEAM?"今日いちばん星がまわっている人。プレゼンや商談は、この人を先頭に。":"今日いちばん星がまわっている人。買い物のくじ引きはこの人に任せましょう。"}</div></div>
      </div>
      <p class="fine">日付はこのページを開いている端末の日付で計算しています。</p>
    </div>`;
}

}

function lookupStroke(ch){
  if(STROKES[ch]) return STROKES[ch];
  if(KANA_STROKES[ch]) return KANA_STROKES[ch];
  // 濁点・半濁点つきかなを分解して加算
  const d=ch.normalize("NFD");
  if(d.length===2 && KANA_STROKES[d[0]]){
    if(d[1]==="゙") return KANA_STROKES[d[0]]+2; // 濁点
    if(d[1]==="゚") return KANA_STROKES[d[0]]+1; // 半濁点
  }
  return null;
}

/* ══════════ 天文・命式計算（個人版と同一ロジック） ══════════ */
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const norm=d=>((d%360)+360)%360;
const mod=(a,n)=>((a%n)+n)%n;
function jdn(y,m,d){const a=Math.floor((14-m)/12),Y=y+4800-a,M=m+12*a-3;
  return d+Math.floor((153*M+2)/5)+365*Y+Math.floor(Y/4)-Math.floor(Y/100)+Math.floor(Y/400)-32045;}
function jdUT(y,m,d,hLocal,utcOff){return jdn(y,m,d)+((hLocal-utcOff)-12)/24;}
function sunLon(jd){const n=jd-2451545,L=norm(280.460+0.9856474*n),g=rad(norm(357.528+0.9856003*n));
  return norm(L+1.915*Math.sin(g)+0.020*Math.sin(2*g));}
function moonLon(jd){const n=jd-2451545;
  return norm(218.316+13.176396*n+6.289*Math.sin(rad(norm(134.963+13.064993*n))));}
function ascendant(jd,lat,lon){const n=jd-2451545;
  const ramc=rad(norm(norm(280.46061837+360.98564736629*n)+lon));
  const eps=rad(23.4393),phi=rad(lat);
  return norm(deg(Math.atan2(Math.cos(ramc),-(Math.sin(ramc)*Math.cos(eps)+Math.tan(phi)*Math.sin(eps)))));}
const signOf=lon=>Math.floor(norm(lon)/30);
function fourPillars(y,m,d,hour,utcOff){
  const sl=sunLon(jdUT(y,m,d,12,utcOff));
  let py=y; if(m<=2 && sl>=270 && sl<315) py=y-1;
  const ys=mod(py-4,10), yb=mod(py-4,12);
  const mi=Math.floor(norm(sl-315)/30);
  const ms=mod((ys%5)*2+2+mi,10), mb=mod(2+mi,12);
  const di=mod(jdn(y,m,d)+49,60), ds=di%10, db=di%12;
  let hs=null,hb=null;
  if(hour!=null){ hb=Math.floor(mod(hour+1,24)/2)%12; hs=mod((ds%5)*2+hb,10); }
  return {py,ys,yb,ms,mb,di,ds,db,hs,hb,sl,mi};
}
function kanshiName(s,b){return STEMS[s]+BRANCHES[b];}
function voidBranches(di){const g=Math.floor(di/10);return [mod(10-2*g,12),mod(11-2*g,12)];}
function tsuhen(dayS,otherS){
  const rel=mod(stemElem(otherS)-stemElem(dayS),5);
  return rel*2+((dayS%2)===(otherS%2)?0:1);
}
function elemRel(mine,other){
  if(mine===other)return 0;
  if(mod(other+1,5)===mine)return 1;
  if(mod(mine+1,5)===other)return 2;
  if(mod(other+2,5)===mine)return 3;
  return 4;
}
function honmeiStar(py){let n=11-mod(py,9); if(n>9)n-=9; return n;}
function yearOfNow(date,utcOff){
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  const sl=sunLon(jdUT(y,m,d,12,utcOff==null?9:utcOff));
  return (m<=2 && sl>=270 && sl<315)?y-1:y;
}
function starAt(center,base){let s=center+(base-5); while(s<1)s+=9; while(s>9)s-=9; return s;}
function kakusuNorm(n){while(n>81)n-=80;return n;}
function nameGrids(seiArr,meiArr){
  const sSum=seiArr.reduce((a,b)=>a+b,0), mSum=meiArr.reduce((a,b)=>a+b,0);
  const ten=sSum+(seiArr.length===1?1:0), chi=mSum+(meiArr.length===1?1:0);
  const jin=seiArr[seiArr.length-1]+meiArr[0], sou=sSum+mSum;
  const gai=Math.max(ten+chi-jin,1);
  return {天格:kakusuNorm(ten),人格:kakusuNorm(jin),地格:kakusuNorm(chi),外格:kakusuNorm(gai),総格:kakusuNorm(sou)};
}

function starsHtml(n){let h="";for(let i=1;i<=5;i++)h+=i<=n?"★":'<span class="off">★</span>';return `<span class="stars" style="font-size:14px" role="img" aria-label="5点満点中${n}点">${h}</span>`;}
function dayScoreFor(fp,di){
  const s=di%10, b=di%12, vb=voidBranches(fp.di);
  let score=3,notes=[];
  if(mod(s-fp.ds+10,10)===5){score++;notes.push("干合の日");}
  if(mod(b+fp.db,12)===1){score++;notes.push("支合の日");}
  if(b%4===fp.db%4&&b!==fp.db){score++;notes.push("三合の追い風");}
  if(mod(fp.db+6,12)===b){score--;notes.push("冲・予定は柔軟に");}
  if(di===fp.di){score=5;notes.push("60日に一度の律の日");}
  if(vb.includes(b)){score=Math.min(score,2);notes.push("空亡・充電日");}
  return {score:Math.max(1,Math.min(5,score)),notes};
}

const LSF_KEY=TEAM?"seimeiroku_team_v1":"seimeiroku_fam_v1";

let PROFILES=[], NOWCTX=null;
document.getElementById("form").addEventListener("submit",e=>{
  e.preventDefault();
  const rows=[...document.querySelectorAll(".member-row")];
  const people=[];
  for(const r of rows){
    const sei=r.querySelector(".isei").value.trim(), mei=r.querySelector(".imei").value.trim();

    let hour=null;
    const hv=r.querySelector(".ih").value;
    if(hv!=="")hour=+hv+(+r.querySelector(".imin").value||0)/60;

  saveMembers();

function buildProfile(p){
  const calcHour=p.hour==null?12:p.hour;
  const jdB=jdUT(p.y,p.m,p.d,calcHour,9);
  const fp=fourPillars(p.y,p.m,p.d,p.hour,9);
  const sun=signOf(sunLon(jdB)), moon=signOf(moonLon(jdB));
  const asc=(p.hour!=null&&p.place)?signOf(ascendant(jdB,p.place[1],p.place[2])):null;
  const myStar=honmeiStar(fp.py);
  const gm=mod(GETSUMEI_START[myStar]-1-fp.mi,9)+1;
  const charNo=fp.di+1, charName=CHARS60[fp.di][0], animal=CHARS60[fp.di][1];
  // 画数（辞書のみ・全文字判明した場合のみ五格算出）
  const seiSt=[...p.sei].map(lookupStroke), meiSt=[...p.mei].map(lookupStroke);
  const grids=(seiSt.every(Boolean)&&meiSt.every(Boolean))?nameGrids(seiSt,meiSt):null;
  // 五行カウント
  const counts=[0,0,0,0,0];
  const parts=[[fp.ys,fp.yb],[fp.ms,fp.mb],[fp.ds,fp.db]];
  if(fp.hs!=null)parts.push([fp.hs,fp.hb]);
  parts.forEach(([s,b])=>{counts[stemElem(s)]++;counts[BRANCH_ELEM[b]]++;});
  return {...p,fp,sun,moon,asc,myStar,gm,charNo,charName,animal,grids,counts};
}

      return "―";
    }))
  ];
  $("kyusei-body").innerHTML=`
    <div class="card"><h3>${nowY}年の方位盤（家族共通の凶方位つき）</h3>

/* 相性くらべ（星座エレメント・日柱干支・九星の三占術） */
function pairDetail(a,b){
  // 星座エレメント
  const ea=SIGNS[a.sun].el, eb=SIGNS[b.sun].el;
  const good=(x,y)=>(x==="火"&&y==="風")||(x==="風"&&y==="火")||(x==="地"&&y==="水")||(x==="水"&&y==="地");
  const sStar=ea===eb?1:good(ea,eb)?2:0;
  const starWord=ea===eb?`${ea}×${eb}・波長が共鳴`:good(ea,eb)?`${ea}×${eb}・引き立て合う好相性`:`${ea}×${eb}・違いが学びの異文化`;
  // 日柱干支（動物占いのベース）
  const gou=mod(a.fp.ds-b.fp.ds+10,10)===5;
  const shigou=mod(a.fp.db+b.fp.db,12)===1;
  const sangou=a.fp.db%4===b.fp.db%4&&a.fp.db!==b.fp.db;
  const chu=mod(a.fp.db+6,12)===b.fp.db;
  const sDay=(gou||shigou||sangou)?2:chu?0:1;
  const dayWord=gou&&shigou?"干合＋支合の「天地徳合」・特別な深い縁":gou?"干合・引かれ合う縁":shigou?"支合・結ばれる縁":sangou?"三合・同じ流れに乗る縁":chu?"冲・ぶつかるほど遠慮のない縁":"穏やかな縁";
  // 九星
  const r=elemRel(KYUSEI[a.myStar-1].el,KYUSEI[b.myStar-1].el);
  const sK=(r===1||r===2)?2:r===0?1:0;
  const kWord=(r===1||r===2)?"気を生じ合う相生":r===0?"同じ気で支え合う比和":"鍛え合う相剋";
  const total=sStar+sDay+sK;
  return {sStar,sDay,sK,total,starWord,dayWord,kWord,sym:total>=5?"◎":total>=3?"○":"△"};
}

    <div class="card">
      <h3>みんなは、どんな家族？</h3>

          <div class="kp-name">${esc(p.mei)}${p.y>=NOWCTX.now.getFullYear()-15?"さん":"さん"}</div>
          <p style="margin:.3em 0">${SIGNS[p.sun].sym} ${SIGNS[p.sun].n}のきみ。${SIGN_KID[p.sun].split("。")[0]}。</p>
          <p style="margin:.3em 0">どうぶつうらないは「<strong>${ANIMAL_EMOJI[p.animal]}${p.animal}</strong>」。${ANIMAL_KID[p.animal].split("。")[0]}。</p>
          <p style="margin:.3em 0">きょうのうんせい　${kidStars(dayScoreFor(p.fp,tdi).score)}</p>
        </div>`).join("")}
      </div>
      <p class="fine" style="margin-top:14px">うらないは「ぜったい」じゃないよ。家族のいいところを見つけたら、こっそり教えてあげよう。</p>

</template>
<script>
"use strict";
const TITLES={kojin:"個人版",kazoku:"家族版",team:"チーム版"};
const frame=document.getElementById("appframe");

function syncTheme(){
  try{
    const d=frame.contentDocument&&frame.contentDocument.documentElement;
    if(!d)return;
    const t=document.documentElement.dataset.theme;
    if(t)d.dataset.theme=t; else delete d.dataset.theme;
  }catch(e){}
}
frame.addEventListener("load",syncTheme);
new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

function openApp(key){
  const tpl=document.getElementById("tpl-"+key);
  if(!tpl)return;
  document.getElementById("select").style.display="none";
  document.getElementById("appbar").style.display="flex";
  document.getElementById("barname").textContent="星命録　"+TITLES[key];
  frame.style.display="block";
  frame.srcdoc=tpl.innerHTML;
  document.body.style.overflow="hidden";
  if(("#"+key)!==location.hash){try{history.replaceState(null,"","#"+key);}catch(e){}}
}
function goHome(){
  frame.srcdoc="";
  frame.style.display="none";
  document.getElementById("appbar").style.display="none";
  document.getElementById("select").style.display="block";
  document.body.style.overflow="";
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
  scrollTo(0,0);
}
(function(){
  const k=location.hash.replace("#","");
  if(TITLES[k])openApp(k);
})();
</script>
